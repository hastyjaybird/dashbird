<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Mingle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041116"/>
      <stop offset="45%" stop-color="#0a242c"/>
      <stop offset="100%" stop-color="#071a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ffc857"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#glow)"/>
  <!-- soft band arc -->
  <path d="M28 78c10-28 62-28 72 0" fill="none" stroke="#9ec4b8" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  <path d="M34 74c8-20 52-20 60 0" fill="none" stroke="#d7efe6" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <!-- LED node -->
  <circle cx="64" cy="52" r="14" fill="url(#signal)"/>
  <circle cx="64" cy="52" r="7" fill="#1a0b04" opacity="0.35"/>
  <circle cx="60" cy="48" r="3.5" fill="#fff" opacity="0.55"/>
  <!-- twin presence dots -->
  <circle cx="42" cy="96" r="5" fill="#3ddc97" opacity="0.9"/>
  <circle cx="86" cy="96" r="5" fill="#ff8a3d" opacity="0.95"/>
  <path d="M48 96h32" stroke="#d7efe6" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
</svg>
